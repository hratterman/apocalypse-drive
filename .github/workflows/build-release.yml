name: Build & Release

on:
  push:
    tags:
      - 'v*'           # v1.0.0, v1.2.3-beta, etc.
  workflow_dispatch:   # Manual trigger from GitHub UI
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0). Leave blank to skip release upload.'
        required: false
        default: ''

permissions:
  contents: write       # Needed to create releases

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pystray Pillow libzim certifi

      - name: Build icons
        run: python scripts/build_icons.py

      - name: Build .app
        run: pyinstaller --noconfirm --clean apocalypse.spec

      - name: Verify .app
        run: |
          test -d "dist/Apocalypse.app" || (echo ".app missing"; exit 1)
          ls -la dist/Apocalypse.app/Contents/MacOS/

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build DMG
        run: |
          mkdir -p release
          create-dmg \
            --volname "Apocalypse" \
            --volicon assets/icon.icns \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 128 \
            --icon "Apocalypse.app" 175 190 \
            --hide-extension "Apocalypse.app" \
            --app-drop-link 425 190 \
            --no-internet-enable \
            "release/Apocalypse-macOS.dmg" \
            "dist/Apocalypse.app" \
            || true   # create-dmg sometimes returns non-zero on success
          ls -la release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apocalypse-macos
          path: release/Apocalypse-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pystray Pillow libzim certifi

      - name: Build icons
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/build_icons.py

      - name: Build .exe
        run: pyinstaller --noconfirm --clean apocalypse.spec

      - name: Verify .exe
        run: |
          if (-not (Test-Path "dist/Apocalypse/Apocalypse.exe")) {
            Write-Error ".exe missing"
            exit 1
          }
          Get-ChildItem dist/Apocalypse | Select-Object -First 10

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Create installer script
        run: |
          @"
          [Setup]
          AppName=Apocalypse
          AppVersion=1.0.0
          AppPublisher=hratterman
          AppPublisherURL=https://github.com/hratterman/apocalypse-drive
          DefaultDirName={autopf}\Apocalypse
          DefaultGroupName=Apocalypse
          DisableProgramGroupPage=yes
          OutputDir=release
          OutputBaseFilename=Apocalypse-Windows-Setup
          SetupIconFile=assets\icon.ico
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64
          PrivilegesRequired=lowest

          [Files]
          Source: "dist\Apocalypse\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Apocalypse"; Filename: "{app}\Apocalypse.exe"
          Name: "{commondesktop}\Apocalypse"; Filename: "{app}\Apocalypse.exe"; Tasks: desktopicon

          [Tasks]
          Name: desktopicon; Description: "Create a desktop icon"; GroupDescription: "Additional icons:"

          [Run]
          Filename: "{app}\Apocalypse.exe"; Description: "Launch Apocalypse"; Flags: nowait postinstall skipifsilent
          "@ | Out-File -FilePath "installer.iss" -Encoding utf8

      - name: Build installer
        run: |
          mkdir release -ErrorAction SilentlyContinue
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apocalypse-windows
          path: release/Apocalypse-Windows-Setup.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps for pystray
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libgirepository-2.0-dev gir1.2-ayatanaappindicator3-0.1 \
            libcairo2-dev pkg-config gobject-introspection

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pystray Pillow libzim certifi
          # PyGObject is optional; pystray works on Linux X11 backend without it.
          # Try install but don't fail the build if system libs aren't perfect.
          pip install PyGObject || echo "PyGObject install skipped (pystray will use X11 backend)"

      - name: Build icons
        run: python scripts/build_icons.py

      - name: Build binary
        run: pyinstaller --noconfirm --clean apocalypse.spec

      - name: Package as tarball (poor man's AppImage)
        run: |
          mkdir -p release
          cd dist && tar czf ../release/Apocalypse-Linux-x86_64.tar.gz Apocalypse/
          cd ..
          ls -la release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apocalypse-linux
          path: release/Apocalypse-Linux-x86_64.tar.gz

  bundle-portable:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show what we got
        run: find artifacts -type f -maxdepth 4 | sort

      - name: Stage portable bundle
        run: |
          set -euo pipefail
          mkdir -p portable/apocalypse-drive

          # Each OS launcher gets its own subfolder. Users grab whichever
          # matches their machine and run it from the drive.
          mkdir -p portable/apocalypse-drive/macos
          mkdir -p portable/apocalypse-drive/windows
          mkdir -p portable/apocalypse-drive/linux

          cp artifacts/apocalypse-macos/Apocalypse-macOS.dmg \
             portable/apocalypse-drive/macos/Apocalypse.dmg
          cp artifacts/apocalypse-windows/Apocalypse-Windows-Setup.exe \
             portable/apocalypse-drive/windows/Apocalypse-Setup.exe
          cp artifacts/apocalypse-linux/Apocalypse-Linux-x86_64.tar.gz \
             portable/apocalypse-drive/linux/Apocalypse.tar.gz

          # Pre-create the runtime layout so the user can drop the unzipped
          # folder onto an exFAT drive and have everything sit at the root.
          mkdir -p portable/apocalypse-drive/apocalypse/kiwix/zim
          mkdir -p portable/apocalypse-drive/apocalypse/llm
          mkdir -p portable/apocalypse-drive/apocalypse/logs

          # Ship Apocalypse.html at the root so users can open it directly
          # in any browser, on any OS, with no app at all (degraded mode:
          # search/browse via plain Kiwix readers, no RAG/LLM).
          cp Apocalypse.html portable/apocalypse-drive/Apocalypse.html

          # README explaining how to launch on each OS
          cat > portable/apocalypse-drive/README.txt <<'EOF'
          APOCALYPSE DRIVE
          ================

          A self-contained offline knowledge library. Drop this folder onto
          any exFAT-formatted drive and read it from any computer with no
          internet.

          HOW TO USE
          ----------

          macOS:
            1. Open the macos/ folder
            2. Double-click Apocalypse.dmg
            3. Drag Apocalypse.app to the drive root (next to this README)
            4. Run it from there

          Windows:
            1. Open the windows/ folder
            2. Run Apocalypse-Setup.exe
            3. When prompted, install to the drive root

          Linux:
            1. Open the linux/ folder
            2. tar xzf Apocalypse.tar.gz to the drive root
            3. ./Apocalypse/Apocalypse

          NO APP, JUST THE DATA
          ---------------------

          You can open Apocalypse.html in any browser to read the landing
          page. To browse ZIMs without our app, install any Kiwix reader
          (kiwix.org) and point it at apocalypse/kiwix/zim/.

          The ZIM format is open and works with kiwix-android, kiwix-desktop,
          kiwix-tools, and any libzim-based reader.

          DRIVE LAYOUT
          ------------

          apocalypse-drive/
            Apocalypse.html        Static landing page, opens in any browser
            README.txt             This file
            macos/                 macOS launcher
            windows/               Windows launcher
            linux/                 Linux launcher
            apocalypse/            Runtime data (created on first run)
              kiwix/zim/           Your downloaded ZIMs
              llm/                 Optional local LLM (.llamafile)
              logs/                Diagnostics

          See the GitHub repo for full docs.
          EOF

          ls -la portable/apocalypse-drive/

      - name: Zip portable bundle
        run: |
          # Zip the contents of apocalypse-drive/ directly (no wrapper folder).
          # User unzips to drive root and gets Apocalypse.html, README.txt,
          # macos/, windows/, linux/, apocalypse/ at top level. No nested
          # folder to navigate into.
          mkdir -p release
          cd portable/apocalypse-drive
          zip -r ../../release/apocalypse-drive.zip . -x "*.DS_Store"
          cd ../..
          ls -la release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apocalypse-portable
          path: release/apocalypse-drive.zip

  release:
    needs: [build-macos, build-windows, build-linux, bundle-portable]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: List downloaded artifacts
        run: find release -type f | sort

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event.inputs.release_tag }}" != "" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Apocalypse ${{ steps.tag.outputs.tag }}
          body: |
            ## Apocalypse ${{ steps.tag.outputs.tag }}

            Self-contained offline knowledge library with built-in RAG.

            ### Downloads
            - **All-in-one (recommended for portable drives)**: `apocalypse-drive.zip` contains all three OS launchers plus the runtime layout. Drop on any exFAT drive, run it from any computer.
            - **macOS only**: `Apocalypse-macOS.dmg` (Intel + Apple Silicon)
            - **Windows only**: `Apocalypse-Windows-Setup.exe`
            - **Linux only**: `Apocalypse-Linux-x86_64.tar.gz`

            ### First run
            Open the app. The setup wizard pops up in your browser. Step 1 picks the drive (internal or external). Step 2 picks a starter pack. Step 3 picks individual ZIMs. Step 4 downloads. When it finishes you have an offline copy of Wikipedia, Khan Academy, Stack Overflow, and more, plus an optional local LLM that grounds answers in those ZIMs.

            ### Notes
            - macOS: first launch hits Gatekeeper. Right-click the app, choose Open, confirm. Once.
            - Windows: SmartScreen may warn. Click "More info" then "Run anyway".
            - Linux: untar and run `./Apocalypse/Apocalypse`.
            - Cross-OS portability: format the destination drive exFAT, drop the unzipped folder onto its root, and the same drive works on macOS, Windows, and Linux machines.

            See README for full docs.
          files: |
            release/apocalypse-macos/Apocalypse-macOS.dmg
            release/apocalypse-windows/Apocalypse-Windows-Setup.exe
            release/apocalypse-linux/Apocalypse-Linux-x86_64.tar.gz
            release/apocalypse-portable/apocalypse-drive.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
