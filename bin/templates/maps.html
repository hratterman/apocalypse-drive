<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Maps · Apocalypse</title>
<link rel="stylesheet" href="/static/themes.css">
<link rel="stylesheet" href="/static/maplibre-gl.css">
<script src="/static/apply-theme.js"></script>
<script src="/static/pmtiles.js"></script>
<script src="/static/maplibre-gl.js"></script>
<style>
  body { margin: 0; padding: 0; }
  .layout { display: flex; flex-direction: column; height: 100vh; }
  .topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-wrap: wrap;
  }
  .topbar h1 {
    font-size: 18px; margin: 0;
    color: var(--text-bright);
    text-transform: var(--button-text-transform);
    letter-spacing: var(--button-letter-spacing);
  }
  [data-theme="geocities"] .topbar {
    background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00, #ff0000) !important;
    border-bottom: 4px ridge #c0c0c0 !important;
  }
  [data-theme="geocities"] .topbar h1 {
    font-family: 'Times New Roman', serif !important;
    color: #ffffff !important;
    text-transform: none !important;
    text-shadow: 2px 2px 0 #000000, 4px 4px 0 #ff00ff !important;
  }
  .topbar select {
    background: var(--bg-glow); color: var(--text-bright);
    border: 1px solid var(--border); padding: 6px 10px;
    font-family: var(--font-stack); font-size: 13px;
    border-radius: var(--border-radius);
  }
  .topbar a {
    color: var(--text-dim); text-decoration: none;
    font-size: 13px; border-bottom: 1px dotted var(--border);
  }
  .topbar a:hover { color: var(--text-bright); }
  #map {
    flex: 1; width: 100%;
    background: var(--bg-glow);
  }
  .empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    flex-direction: column; padding: 40px; text-align: center;
    color: var(--text);
  }
  .empty h2 { margin: 0 0 12px 0; color: var(--text-bright); }
  .empty p { color: var(--text-dim); max-width: 600px; line-height: 1.6; margin: 8px 0; }
  .empty code {
    background: var(--bg-glow); padding: 2px 8px;
    border: 1px solid var(--border); border-radius: var(--border-radius);
    font-family: var(--font-stack); font-size: 13px;
    color: var(--text-bright);
  }
  .empty .sources {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--border-radius); padding: 16px 20px;
    margin-top: 24px; max-width: 520px; text-align: left;
  }
  .empty .sources h3 { margin: 0 0 8px 0; font-size: 13px; color: var(--text-bright); text-transform: uppercase; letter-spacing: 1px; }
  .empty .sources ul { margin: 0; padding-left: 18px; }
  .empty .sources li { margin: 4px 0; font-size: 13px; }
  .empty .sources li a { color: var(--text-bright); }
  .status { font-size: 12px; color: var(--text-dim); margin-left: auto; }
  /* MapLibre overrides to look at home in our themes. */
  .maplibregl-ctrl-attrib { background: var(--panel) !important; color: var(--text-dim) !important; }
  .maplibregl-ctrl-attrib a { color: var(--text-bright) !important; }
  .maplibregl-ctrl-group { background: var(--panel) !important; border: 1px solid var(--border) !important; }
  .maplibregl-ctrl-group button { background: var(--panel) !important; }
  .maplibregl-ctrl-group button:hover { background: var(--bg-glow) !important; }
  /* Geocities chaos. */
  [data-theme="geocities"] .maplibregl-ctrl-attrib {
    background: #c0c0c0 !important; color: #000080 !important;
    border: 2px ridge #ffffff !important; font-family: 'Times New Roman', serif !important;
  }
</style>
</head>
<body>
<div class="layout">
  <div class="topbar">
    <h1>Maps</h1>
    <select id="mapPicker"><option>Loading...</option></select>
    <a href="/">← home</a>
    <span class="status" id="status"></span>
  </div>
  <div id="container" style="flex:1; display:flex; flex-direction:column;"></div>
</div>

<script>
const status = document.getElementById('status');
const picker = document.getElementById('mapPicker');
const container = document.getElementById('container');
let currentMap = null;

// Register the PMTiles protocol with MapLibre. This wires the pmtiles://
// URL scheme to PMTiles JS's range-aware fetcher.
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', protocol.tile);

// Style derived from the protomaps basemap. Uses our theme colors so
// the map blends with the rest of the app. This is intentionally
// minimal full protomaps style packs are 100KB+ of JSON. We render
// the essentials: water, land, roads, place labels.
function buildStyle(pmtilesUrl, theme) {
  const t = theme || 'terminal';
  // Map colors are tuned for visual contrast at typical zoom levels (5-12).
  // The land/water/road palette has to be DIFFERENT enough to read at a
  // glance, even when the theme's primary text and background are very
  // close in luminance.
  const COLORS = {
    terminal:  { water: '#2a1500', land: '#0a0500', road: '#ffb347', label: '#ffcc66', boundary: '#8a5a1f' },
    paper:     { water: '#bcd4d4', land: '#f5efe1', road: '#6b5f48', label: '#1a1612', boundary: '#9b8d72' },
    forest:    { water: '#1f3530', land: '#0e1612', road: '#9bc080', label: '#e8efd9', boundary: '#7a8a72' },
    solarized: { water: '#93a1a1', land: '#fdf6e3', road: '#586e75', label: '#073642', boundary: '#b8b099' },
    geocities: { water: '#000080', land: '#c0c0c0', road: '#ff0000', label: '#000000', boundary: '#ff00ff' },
  };
  const c = COLORS[t] || COLORS.terminal;
  return {
    version: 8,
    // glyphs intentionally omitted text labels disabled in the layer list
    // below. Including a glyph URL forces MapLibre to fetch from a remote
    // server, which defeats the offline guarantee. Future: bundle the
    // protomaps font glyphs locally and serve them via /static/glyphs/.
    sources: {
      'protomaps': {
        type: 'vector',
        url: 'pmtiles://' + pmtilesUrl,
        attribution: '© OpenStreetMap contributors, Protomaps',
      }
    },
    layers: [
      // Background fills any uncovered map area (when zoomed past data bounds).
      { id: 'background', type: 'background', paint: { 'background-color': c.water } },
      // Land mass (this is what protomaps calls 'earth').
      { id: 'earth', type: 'fill', source: 'protomaps', 'source-layer': 'earth',
        paint: { 'fill-color': c.land } },
      // Generic landuse (parks, residential, industrial). Tinted differently
      // for parks if desired.
      { id: 'landuse', type: 'fill', source: 'protomaps', 'source-layer': 'landuse',
        paint: { 'fill-color': c.land, 'fill-opacity': 0.5 } },
      // Water (rivers, lakes, oceans).
      { id: 'water', type: 'fill', source: 'protomaps', 'source-layer': 'water',
        paint: { 'fill-color': c.water } },
      // Roads (drawn on top of water/land). Width is intentionally
      // generous so roads are visible at low zoom on dark themes.
      { id: 'roads', type: 'line', source: 'protomaps', 'source-layer': 'roads',
        paint: {
          'line-color': c.road,
          'line-width': ['interpolate', ['linear'], ['zoom'], 5, 0.5, 8, 1.2, 12, 2, 16, 4]
        } },
      // Administrative boundaries (state, county lines).
      { id: 'boundaries', type: 'line', source: 'protomaps', 'source-layer': 'boundaries',
        paint: {
          'line-color': c.boundary,
          'line-width': ['interpolate', ['linear'], ['zoom'], 5, 0.8, 10, 1.5],
          'line-opacity': 0.7,
          'line-dasharray': [2, 2],
        } },
      // Place markers (no text glyphs unavailable offline). Tooltips are
      // wired below in JS so users can still see place names on hover.
      {
        id: 'place-markers', type: 'circle', source: 'protomaps', 'source-layer': 'places',
        paint: {
          'circle-radius': ['interpolate', ['linear'], ['zoom'], 5, 1.5, 10, 4],
          'circle-color': c.label,
          'circle-stroke-color': c.land,
          'circle-stroke-width': 1,
          'circle-opacity': 0.9,
        },
      },
    ],
  };
}

function fmtBytes(n) {
  if (n < 1024) return n + 'B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + 'KB';
  if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + 'MB';
  return (n / 1024 / 1024 / 1024).toFixed(2) + 'GB';
}

function showEmpty() {
  container.innerHTML = `
    <div class="empty">
      <h2>No maps installed yet</h2>
      <p>Drop any <code>.pmtiles</code> file into <code>${INSTALL_DIR}/resources/maps/</code> and it will show up here. The viewer streams tiles via HTTP range requests, so even multi-GB world basemaps render fast.</p>
      <div class="sources">
        <h3>Where to get maps</h3>
        <ul>
          <li><a href="https://maps.protomaps.com/" target="_blank">Protomaps</a> single-file PMTiles for any region. Free for personal use.</li>
          <li><a href="https://wiki.openstreetmap.org/wiki/PMTiles" target="_blank">OpenStreetMap PMTiles wiki</a> community-built tilesets.</li>
          <li><a href="https://download.geofabrik.de/" target="_blank">Geofabrik</a> raw OSM data. Convert with <code>tilemaker</code> or <code>planetiler</code>.</li>
        </ul>
        <p style="margin-top: 12px; color: var(--text-dim); font-size: 12px;">When the network goes down, the maps you've already downloaded keep working forever. That's the whole point.</p>
      </div>
    </div>
  `;
}

let INSTALL_DIR = '/Volumes/Untitled/apocalypse';
async function loadInstallDir() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();
    if (d && d.install_dir) INSTALL_DIR = d.install_dir;
  } catch (e) { /* keep default */ }
}

async function loadMaps() {
  await loadInstallDir();
  let resp;
  try {
    resp = await fetch('/api/maps/list');
  } catch (e) {
    status.textContent = 'failed to list maps';
    showEmpty();
    return;
  }
  const data = await resp.json();
  const maps = data.maps || [];
  picker.innerHTML = '';
  if (!maps.length) {
    picker.innerHTML = '<option>(none installed)</option>';
    picker.disabled = true;
    showEmpty();
    return;
  }
  picker.disabled = false;
  for (const m of maps) {
    const opt = document.createElement('option');
    opt.value = m.name;
    opt.textContent = `${m.name} (${fmtBytes(m.size)})`;
    if (m.source === 'bundled') opt.textContent += ' [sample]';
    picker.appendChild(opt);
  }
  picker.onchange = () => openMap(picker.value);
  openMap(maps[0].name);
}

function openMap(filename) {
  if (currentMap) { currentMap.remove(); currentMap = null; }
  container.innerHTML = '<div id="map"></div>';
  const url = window.location.origin + '/maps/file/' + encodeURIComponent(filename);
  const theme = document.documentElement.getAttribute('data-theme') || 'terminal';
  status.textContent = `loading ${filename}…`;

  // Read the PMTiles header to grab bounds + minzoom for initial view.
  const archive = new pmtiles.PMTiles(url);
  archive.getHeader().then(h => {
    const center = [(h.minLon + h.maxLon) / 2, (h.minLat + h.maxLat) / 2];
    const map = new maplibregl.Map({
      container: 'map',
      style: buildStyle(url, theme),
      center: center,
      zoom: Math.max(h.minZoom, 5),
      maxBounds: [[h.minLon - 1, h.minLat - 1], [h.maxLon + 1, h.maxLat + 1]],
      attributionControl: { compact: true },
    });
    map.addControl(new maplibregl.NavigationControl(), 'top-right');
    map.fitBounds([[h.minLon, h.minLat], [h.maxLon, h.maxLat]], { padding: 20, animate: false });

    // Hover tooltip for place markers (compensates for the glyph-less style).
    const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 8 });
    map.on('mouseenter', 'place-markers', (e) => {
      map.getCanvas().style.cursor = 'pointer';
      const f = e.features[0];
      const name = f.properties && (f.properties.name || f.properties['name:en']);
      if (!name) return;
      popup.setLngLat(e.lngLat).setText(name).addTo(map);
    });
    map.on('mouseleave', 'place-markers', () => {
      map.getCanvas().style.cursor = '';
      popup.remove();
    });

    currentMap = map;
    status.textContent = `${filename} ready`;
    map.on('error', e => {
      status.textContent = 'render error: ' + (e.error?.message || 'unknown');
    });
  }).catch(err => {
    status.textContent = 'pmtiles error: ' + err.message;
  });
}

loadMaps();
</script>
</body>
</html>
