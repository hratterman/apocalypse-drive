<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a0a00"/>
      <stop offset="100%" stop-color="#0a0500"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="460" fill="url(#bg2)"/>

  <!-- Header -->
  <text x="50" y="40" fill="#8a5a1f" font-size="12">> ls -la /Volumes/MyDrive/apocalypse</text>
  <text x="640" y="44" fill="#ffcc66" font-size="14" text-anchor="middle" letter-spacing="2">DRIVE LAYOUT</text>

  <!-- Tree column on left -->
  <g font-size="13" fill="#ffb347">
    <text x="50" y="100">apocalypse/</text>
    <text x="50" y="124">├── <tspan fill="#ffcc66" font-weight="bold">Apocalypse.command</tspan>   <tspan fill="#5a3a14" font-size="11">macOS launcher (double-click)</tspan></text>
    <text x="50" y="148">├── <tspan fill="#ffcc66" font-weight="bold">Apocalypse.sh</tspan>        <tspan fill="#5a3a14" font-size="11">Linux launcher</tspan></text>
    <text x="50" y="172">├── <tspan fill="#ffcc66" font-weight="bold">Apocalypse.bat</tspan>       <tspan fill="#5a3a14" font-size="11">Windows launcher</tspan></text>
    <text x="50" y="196">├── <tspan fill="#ffcc66" font-weight="bold">Apocalypse.html</tspan>      <tspan fill="#5a3a14" font-size="11">single-file UI, 5 themes</tspan></text>
    <text x="50" y="220">│</text>
    <text x="50" y="244">├── bin/</text>
    <text x="50" y="268">│   ├── <tspan fill="#ffcc66">kiwix_shim.py</tspan>    <tspan fill="#5a3a14" font-size="11">~700 lines: shim + RAG pipeline</tspan></text>
    <text x="50" y="292">│   ├── macos-arm64/      <tspan fill="#5a3a14" font-size="11">kiwix-serve binary</tspan></text>
    <text x="50" y="316">│   ├── macos-x86_64/</text>
    <text x="50" y="340">│   ├── linux-x86_64/</text>
    <text x="50" y="364">│   ├── linux-aarch64/</text>
    <text x="50" y="388">│   └── win-x86_64/</text>
    <text x="50" y="412">│</text>
    <text x="50" y="436">├── llm/  <tspan fill="#5a3a14" font-size="11">.llamafile binaries (3B and/or 8B)</tspan></text>
  </g>

  <!-- Right side: stats -->
  <g transform="translate(700, 100)">
    <text x="0" y="0" fill="#5a3a14" font-size="11">[storage breakdown]</text>

    <!-- Bar 1: Wikipedia -->
    <g transform="translate(0, 24)">
      <text x="0" y="14" fill="#ffcc66" font-size="12">wikipedia (en, no images)</text>
      <text x="540" y="14" fill="#8a5a1f" font-size="12" text-anchor="end">115 gb</text>
      <rect x="0" y="20" width="540" height="6" fill="#1a0a00"/>
      <rect x="0" y="20" width="345" height="6" fill="#ffb347"/>
    </g>

    <!-- Bar 2: Khan academy -->
    <g transform="translate(0, 56)">
      <text x="0" y="14" fill="#ffcc66" font-size="12">khan academy</text>
      <text x="540" y="14" fill="#8a5a1f" font-size="12" text-anchor="end">168 gb</text>
      <rect x="0" y="20" width="540" height="6" fill="#1a0a00"/>
      <rect x="0" y="20" width="504" height="6" fill="#ffb347"/>
    </g>

    <!-- Bar 3: Gutenberg -->
    <g transform="translate(0, 88)">
      <text x="0" y="14" fill="#ffcc66" font-size="12">project gutenberg</text>
      <text x="540" y="14" fill="#8a5a1f" font-size="12" text-anchor="end">107 gb</text>
      <rect x="0" y="20" width="540" height="6" fill="#1a0a00"/>
      <rect x="0" y="20" width="321" height="6" fill="#ffb347"/>
    </g>

    <!-- Bar 4: Stack overflow -->
    <g transform="translate(0, 120)">
      <text x="0" y="14" fill="#ffcc66" font-size="12">stack overflow</text>
      <text x="540" y="14" fill="#8a5a1f" font-size="12" text-anchor="end">80 gb</text>
      <rect x="0" y="20" width="540" height="6" fill="#1a0a00"/>
      <rect x="0" y="20" width="240" height="6" fill="#ffb347"/>
    </g>

    <!-- Bar 5: Wikisource -->
    <g transform="translate(0, 152)">
      <text x="0" y="14" fill="#ffcc66" font-size="12">wikisource</text>
      <text x="540" y="14" fill="#8a5a1f" font-size="12" text-anchor="end">18 gb</text>
      <rect x="0" y="20" width="540" height="6" fill="#1a0a00"/>
      <rect x="0" y="20" width="54" height="6" fill="#ffb347"/>
    </g>

    <!-- Bar 6: smaller wikis combined -->
    <g transform="translate(0, 184)">
      <text x="0" y="14" fill="#ffcc66" font-size="12">misc (wikibooks, wikivoyage, wikispecies, 6 SE sites)</text>
      <text x="540" y="14" fill="#8a5a1f" font-size="12" text-anchor="end">~25 gb</text>
      <rect x="0" y="20" width="540" height="6" fill="#1a0a00"/>
      <rect x="0" y="20" width="75" height="6" fill="#ffb347"/>
    </g>

    <!-- Models + binaries -->
    <g transform="translate(0, 216)">
      <text x="0" y="14" fill="#ffcc66" font-size="12">llm models + cross-platform binaries</text>
      <text x="540" y="14" fill="#8a5a1f" font-size="12" text-anchor="end">~8 gb</text>
      <rect x="0" y="20" width="540" height="6" fill="#1a0a00"/>
      <rect x="0" y="20" width="24" height="6" fill="#ffb347"/>
    </g>

    <!-- Total -->
    <g transform="translate(0, 260)">
      <line x1="0" y1="0" x2="540" y2="0" stroke="#3a2400" stroke-width="1"/>
      <text x="0" y="20" fill="#ffcc66" font-size="13" font-weight="bold">total (everything)</text>
      <text x="540" y="20" fill="#ffcc66" font-size="13" font-weight="bold" text-anchor="end">~520 gb</text>
      <text x="0" y="40" fill="#5a3a14" font-size="11">2 tb usb-c ssd recommended; pick a subset for less</text>
    </g>
  </g>
</svg>
