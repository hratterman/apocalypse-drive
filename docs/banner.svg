  <text x="1230" y="50" fill="#4ade80" font-size="12" text-anchor="end">[ ALL SYSTEMS ONLINE ]</text>
  <circle cx="1078" cy="46" r="4" fill="#4ade80">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Big ASCII logo, centered. Use 11px line-height-ish via dy. -->
  <g fill="#ffb347" filter="url(#glow)" font-size="14" font-weight="bold" text-anchor="middle">
    <text x="640" y="120" xml:space="preserve">    █████╗ ██████╗  ██████╗  ██████╗ █████╗ ██╗  ██╗   ██╗██████╗ ███████╗███████╗</text>
    <text x="640" y="136" xml:space="preserve">   ██╔══██╗██╔══██╗██╔═══██╗██╔════╝██╔══██╗██║  ╚██╗ ██╔╝██╔══██╗██╔════╝██╔════╝</text>
    <text x="640" y="152" xml:space="preserve">   ███████║██████╔╝██║   ██║██║     ███████║██║   ╚████╔╝ ██████╔╝███████╗█████╗  </text>
    <text x="640" y="168" xml:space="preserve">   ██╔══██║██╔═══╝ ██║   ██║██║     ██╔══██║██║    ╚██╔╝  ██╔═══╝ ╚════██║██╔══╝  </text>
    <text x="640" y="184" xml:space="preserve">   ██║  ██║██║     ╚██████╔╝╚██████╗██║  ██║███████╗██║   ██║     ███████║███████╗</text>
    <text x="640" y="200" xml:space="preserve">   ╚═╝  ╚═╝╚═╝      ╚═════╝  ╚═════╝╚═╝  ╚═╝╚══════╝╚═╝   ╚═╝     ╚══════╝╚══════╝</text>
  </g>

  <!-- Subtitle -->
  <text x="640" y="240" fill="#ffcc66" font-size="14" text-anchor="middle" letter-spacing="3">OFFLINE KNOWLEDGE TERMINAL</text>

  <!-- Divider -->
  <line x1="440" y1="258" x2="840" y2="258" stroke="#3a2400" stroke-width="1"/>

  <!-- Tagline -->
