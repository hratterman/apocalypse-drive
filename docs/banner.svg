<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1a0a00" stop-opacity="1"/>
      <stop offset="80%" stop-color="#0a0500" stop-opacity="1"/>
    </radialGradient>
    <pattern id="scanlines" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="transparent"/>
      <rect width="3" height="1" y="2" fill="rgba(0,0,0,0.35)"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#vignette)"/>
  <rect width="1280" height="360" fill="url(#scanlines)"/>

  <!-- Amber bracket frame -->
  <g stroke="#3a2400" stroke-width="2" fill="none">
    <path d="M 24 24 L 24 60 M 24 24 L 60 24"/>
    <path d="M 1256 24 L 1256 60 M 1256 24 L 1220 24"/>
    <path d="M 24 336 L 24 300 M 24 336 L 60 336"/>
    <path d="M 1256 336 L 1256 300 M 1256 336 L 1220 336"/>
  </g>

  <!-- Top status bar -->
